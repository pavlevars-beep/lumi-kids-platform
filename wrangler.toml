# Cloudflare Workers konfiguracija za Lumi Kids Studio
name = "lumi-kids-studio"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Custom domeni — odkomentariši kad je zona lumikids.rs aktivna na Cloudflare nalogu.
# [[routes]]
# pattern = "lumikids.rs"
# custom_domain = true
#
# [[routes]]
# pattern = "www.lumikids.rs"
# custom_domain = true

# D1 baza u kojoj se čuvaju upiti sa sajta.
[[d1_databases]]
binding = "DB"
database_name = "lumi-kids"
database_id = "04a8b679-d7ee-4a3e-ba27-c43e0f304df5"
migrations_dir = "migrations"

[vars]
# Adresa(e) na koje stižu obaveštenja o novim upitima (odvojene zarezom).
NOTIFY_EMAIL = ""
# Pošiljalac mejlova (domen lumikids.rs je verifikovan u Resend-u).
FROM_EMAIL = "Lumi Kids Studio <info@lumikids.rs>"
REPLY_TO = "info@lumikids.rs"
SITE_URL = "https://lumikids.rs"
# Secrets (npx wrangler secret put ...): RESEND_API_KEY, ADMIN_PASSWORD, SESSION_SECRET
